# nginx site for the Cuber Hub sync relay at wss://relay.cuberhub.cz → the Evolu relay on 127.0.0.1:26547
# (cuberhub-relay.service). Installed by deploy/server/install.sh as /etc/nginx/sites-available/relay.cuberhub.cz.
# nginx serves no files for this site: everything goes to the relay, which only speaks WebSocket and /health.

# The relay admits anyone who finds it, so nginx limits how many connections one address may hold.
# (An app holds one connection for all its tabs.)
limit_conn_zone $binary_remote_addr zone=cuberhub_relay:1m;

map $http_upgrade $cuberhub_relay_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.cuberhub.cz;

    # Redirect inside a location, not at server level, so certbot's renewal can still answer its challenge on :80.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relay.cuberhub.cz;

    ssl_certificate     /etc/letsencrypt/live/relay.cuberhub.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.cuberhub.cz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/relay.cuberhub.cz.access.log;
    error_log  /var/log/nginx/relay.cuberhub.cz.error.log;

    limit_conn cuberhub_relay 20;

    location / {
        proxy_pass http://127.0.0.1:26547;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cuberhub_relay_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The relay sends a heartbeat on an idle connection at least every 30 s; nginx must wait longer than that.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
