# nginx site for Cuber Hub at https://cuberhub.cz: the built app, static files from /var/www/cuberhub.
# Installed by deploy/server/install.sh as /etc/nginx/sites-available/cuberhub.cz (linked in sites-enabled).
# The certificate (cuberhub.cz with www.cuberhub.cz) comes from certbot; install.sh gets it the first time.

server {
    listen 80;
    listen [::]:80;
    server_name cuberhub.cz www.cuberhub.cz;

    # Redirect inside a location, not at server level, so certbot's renewal can still answer its challenge on :80.
    location / {
        return 301 https://cuberhub.cz$request_uri;
    }
}

# The browser keeps the app's data per address, so there is one address: www goes to the bare name.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.cuberhub.cz;

    ssl_certificate     /etc/letsencrypt/live/cuberhub.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuberhub.cz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cuberhub.cz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cuberhub.cz;

    ssl_certificate     /etc/letsencrypt/live/cuberhub.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuberhub.cz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/cuberhub.cz.access.log;
    error_log  /var/log/nginx/cuberhub.cz.error.log;

    root /var/www/cuberhub;
    index index.html;

    # The app is a megabyte of script and SQLite as WebAssembly; compressed it is less than half.
    gzip_types text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # The page may only run its own scripts and talk to its own relay: the key to a user's synced data is
    # kept in the browser's storage, where any foreign script could read it.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://relay.cuberhub.cz; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'";

    # The page and the other unhashed files are checked for a new version every time.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # nginx knows no type for a web app manifest; browsers want this one.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Built files have a hash of their content in their names: a new build has new names, so these never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
